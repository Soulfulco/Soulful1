openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Soulful Corporate Wellbeing Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: practitioners
    description: Practitioner operations
  - name: companies
    description: Corporate company operations
  - name: bookings
    description: Booking operations
  - name: availability
    description: Practitioner availability / timetable
  - name: subscriptions
    description: Subscription plan operations
  - name: reviews
    description: Review operations
  - name: dashboard
    description: Dashboard summary operations
  - name: locations
    description: Event location operations
  - name: employees
    description: Employee self-booking and invite operations
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Practitioners ──────────────────────────────────────────────────────────
  /practitioners:
    get:
      operationId: listPractitioners
      tags: [practitioners]
      summary: List all active practitioners
      parameters:
        - in: query
          name: specialism
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: List of practitioners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Practitioner"
    post:
      operationId: createPractitioner
      tags: [practitioners]
      summary: Register as a practitioner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PractitionerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practitioner"

  /practitioners/showcase:
    get:
      operationId: listPractitionerShowcase
      tags: [practitioners]
      summary: Public list of practitioners for marketing display (safe fields only)
      responses:
        "200":
          description: List of practitioner showcase items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PractitionerShowcase"

  /practitioners/{id}:
    get:
      operationId: getPractitioner
      tags: [practitioners]
      summary: Get a practitioner by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Practitioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practitioner"
        "404":
          description: Not found
    patch:
      operationId: updatePractitioner
      tags: [practitioners]
      summary: Update practitioner profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PractitionerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practitioner"

  /practitioners/{id}/reviews:
    get:
      operationId: getPractitionerReviews
      tags: [practitioners]
      summary: Get reviews for a practitioner
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  # ── Companies ───────────────────────────────────────────────────────────────
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Register a corporate company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/showcase:
    get:
      operationId: listCompanyShowcase
      tags: [companies]
      summary: Public list of companies for marketing display (safe fields only)
      responses:
        "200":
          description: List of company showcase items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyShowcase"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update company details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  # ── Availability / Timetable ────────────────────────────────────────────────
  /practitioners/{id}/availability:
    get:
      operationId: listPractitionerSlots
      tags: [availability]
      summary: Get available time slots for a practitioner
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"
    post:
      operationId: createTimeSlot
      tags: [availability]
      summary: Add a time slot (practitioner manages own timetable)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeSlotInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"

  /timeslots/{id}:
    delete:
      operationId: deleteTimeSlot
      tags: [availability]
      summary: Remove a time slot
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Bookings ────────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings (filterable by company or practitioner)
      parameters:
        - in: query
          name: companyId
          schema: { type: integer }
        - in: query
          name: practitionerId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string, enum: [pending, confirmed, completed, cancelled] }
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Book a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # ── Subscriptions ───────────────────────────────────────────────────────────
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all subscription plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscriptions/company:
    get:
      operationId: listCompanySubscriptions
      tags: [subscriptions]
      summary: List active corporate subscriptions
      responses:
        "200":
          description: Corporate subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanySubscription"
    post:
      operationId: createCompanySubscription
      tags: [subscriptions]
      summary: Subscribe a company to a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySubscriptionInput"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySubscription"

  /subscriptions/practitioner:
    get:
      operationId: listPractitionerSubscriptions
      tags: [subscriptions]
      summary: List active practitioner subscriptions
      responses:
        "200":
          description: Practitioner subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PractitionerSubscription"
    post:
      operationId: createPractitionerSubscription
      tags: [subscriptions]
      summary: Subscribe a practitioner to a listing plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PractitionerSubscriptionInput"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PractitionerSubscription"

  # ── Stripe payments ─────────────────────────────────────────────────────────
  /stripe/products-with-prices:
    get:
      operationId: listStripeProductsWithPrices
      tags: [stripe]
      summary: List Stripe products with their prices (synced from Stripe)
      responses:
        "200":
          description: Products with prices
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StripeProduct"

  /stripe/checkout:
    post:
      operationId: createStripeCheckout
      tags: [stripe]
      summary: Start a Stripe Checkout subscription for a company or practitioner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCheckoutInput"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeRedirect"

  /stripe/portal:
    post:
      operationId: createStripePortal
      tags: [stripe]
      summary: Open the Stripe billing portal for a company or practitioner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripePortalInput"
      responses:
        "200":
          description: Billing portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeRedirect"

  /stripe/subscription:
    get:
      operationId: getStripeSubscriptionStatus
      tags: [stripe]
      summary: Get the app-side subscription status for a company or practitioner
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
        - name: practitionerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeSubscriptionStatus"

  # ── Reviews ─────────────────────────────────────────────────────────────────
  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review for a practitioner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # ── Specialisms ──────────────────────────────────────────────────────────────
  /specialisms:
    get:
      operationId: listSpecialisms
      tags: [specialisms]
      summary: List all specialisms (public)
      responses:
        "200":
          description: List of specialisms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialism"
    post:
      operationId: createSpecialism
      tags: [specialisms]
      summary: Create a specialism (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialismInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialism"

  /specialisms/{id}:
    put:
      operationId: updateSpecialism
      tags: [specialisms]
      summary: Update a specialism (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialismInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialism"
    delete:
      operationId: deleteSpecialism
      tags: [specialisms]
      summary: Delete a specialism (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  # ── Dashboard ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Platform-wide summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/upcoming-bookings:
    get:
      operationId: getUpcomingBookings
      tags: [dashboard]
      summary: Next 5 upcoming bookings
      parameters:
        - in: query
          name: companyId
          schema: { type: integer }
        - in: query
          name: practitionerId
          schema: { type: integer }
      responses:
        "200":
          description: Upcoming bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /dashboard/popular-practitioners:
    get:
      operationId: getPopularPractitioners
      tags: [dashboard]
      summary: Top practitioners by booking count
      responses:
        "200":
          description: Popular practitioners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Practitioner"

  /dashboard/specialisms:
    get:
      operationId: getSpecialismBreakdown
      tags: [dashboard]
      summary: Booking counts grouped by specialism
      responses:
        "200":
          description: Specialism breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialismCount"

  # ── Employees ─────────────────────────────────────────────────────────────────
  /employees:
    post:
      operationId: registerEmployee
      tags: [employees]
      summary: Register an employee (via invite code or direct companyId)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeCreate" }
      responses:
        "201":
          description: Employee registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }

  /employees/login:
    post:
      operationId: loginEmployee
      tags: [employees]
      summary: Look up an employee by email and companyId (passwordless)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeLogin" }
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "404":
          description: Not found

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }

  /employees/{id}/bookings:
    get:
      operationId: listEmployeeBookings
      tags: [employees]
      summary: List bookings for an employee
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }

  /companies/{id}/employees:
    get:
      operationId: listCompanyEmployees
      tags: [employees]
      summary: List all employees for a company (HR view)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }

  /companies/{id}/employees/bulk:
    post:
      operationId: bulkCreateEmployees
      tags: [employees]
      summary: Create many employees for a company at once (HR view)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeBulkCreate" }
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeBulkResult" }
        "400":
          description: Invalid request
        "404":
          description: Company not found

  /companies/{id}/utilisation:
    get:
      operationId: getCompanyUtilisation
      tags: [employees]
      summary: Get utilisation stats for a company
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Utilisation stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Utilisation" }

  /companies/join/{code}:
    get:
      operationId: resolveInviteCode
      tags: [employees]
      summary: Resolve an invite code to a company (public)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Company info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyPublic" }
        "404":
          description: Invalid invite code

  # ── Locations ────────────────────────────────────────────────────────────────
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all event locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Add a new event location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Not found
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    StripePrice:
      type: object
      required: [id, unitAmount, currency]
      properties:
        id:
          type: string
        unitAmount:
          type: integer
          nullable: true
          description: Amount in the smallest currency unit (e.g. pence).
        currency:
          type: string
        recurring:
          type: object
          nullable: true
          additionalProperties: true
    StripeProduct:
      type: object
      required: [id, name, prices]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        prices:
          type: array
          items:
            $ref: "#/components/schemas/StripePrice"
    StripeCheckoutInput:
      type: object
      required: [planId]
      properties:
        planId:
          type: integer
          description: The app subscription_plans id.
        companyId:
          type: integer
          description: Provide for a corporate subscription.
        practitionerId:
          type: integer
          description: Provide for a practitioner listing subscription.
        successPath:
          type: string
          description: Path to return to on success (default /dashboard).
        cancelPath:
          type: string
          description: Path to return to on cancel (default /).
    StripePortalInput:
      type: object
      properties:
        companyId:
          type: integer
        practitionerId:
          type: integer
        returnPath:
          type: string
    StripeRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          nullable: true
          description: The Stripe-hosted URL to redirect the user to.
    StripeSubscriptionStatus:
      type: object
      properties:
        subscriptionStatus:
          type: string
          nullable: true
          description: The app-side status on the company/practitioner record.
        planId:
          type: integer
          nullable: true
        status:
          type: string
          nullable: true
          description: The status of the linked subscription row.
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Practitioner ────────────────────────────────────────────────────────
    Practitioner:
      type: object
      required: [id, name, email, specialism, bio, sessionRateGbp, isActive, subscriptionStatus, avatarUrl, createdAt]
      properties:
        id:            { type: integer }
        name:          { type: string }
        email:         { type: string }
        specialism:    { type: string }
        bio:           { type: string }
        sessionRateGbp: { type: number }
        isActive:      { type: boolean }
        subscriptionStatus: { type: string, enum: [active, inactive, trial] }
        avatarUrl:     { type: ["string", "null"] }
        location:      { type: ["string", "null"] }
        qualifications: { type: ["string", "null"] }
        averageRating: { type: ["number", "null"] }
        totalReviews:  { type: integer }
        createdAt:     { type: string }

    PractitionerShowcase:
      type: object
      required: [id, name, specialism, avatarUrl]
      properties:
        id:            { type: integer }
        name:          { type: string }
        specialism:    { type: string }
        avatarUrl:     { type: ["string", "null"] }

    PractitionerInput:
      type: object
      required: [name, email, specialism, bio, sessionRateGbp]
      properties:
        name:          { type: string }
        email:         { type: string }
        specialism:    { type: string }
        bio:           { type: string }
        sessionRateGbp: { type: number }
        location:      { type: string }
        qualifications: { type: string }
        avatarUrl:     { type: string }

    PractitionerUpdate:
      type: object
      properties:
        name:          { type: string }
        bio:           { type: string }
        specialism:    { type: string }
        sessionRateGbp: { type: number }
        location:      { type: string }
        qualifications: { type: string }
        avatarUrl:     { type: string }
        isActive:      { type: boolean }

    # ── Specialism ──────────────────────────────────────────────────────────
    Specialism:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:        { type: integer }
        name:      { type: string }
        sortOrder: { type: integer }

    SpecialismInput:
      type: object
      required: [name]
      properties:
        name:      { type: string }
        sortOrder: { type: integer }

    # ── Company ─────────────────────────────────────────────────────────────
    Company:
      type: object
      required: [id, name, email, industry, employeeCount, subscriptionStatus, createdAt]
      properties:
        id:               { type: integer }
        name:             { type: string }
        email:            { type: string }
        industry:         { type: string }
        employeeCount:    { type: integer }
        subscriptionStatus: { type: string, enum: [active, inactive, trial] }
        logoUrl:          { type: ["string", "null"] }
        contactName:      { type: ["string", "null"] }
        totalBookings:    { type: integer }
        createdAt:        { type: string }

    CompanyShowcase:
      type: object
      required: [id, name, logoUrl]
      properties:
        id:               { type: integer }
        name:             { type: string }
        logoUrl:          { type: ["string", "null"] }

    CompanyInput:
      type: object
      required: [name, email, industry, employeeCount, contactName]
      properties:
        name:          { type: string }
        email:         { type: string }
        industry:      { type: string }
        employeeCount: { type: integer }
        contactName:   { type: string }
        logoUrl:       { type: string }

    CompanyUpdate:
      type: object
      properties:
        name:          { type: string }
        industry:      { type: string }
        employeeCount: { type: integer }
        contactName:   { type: string }
        logoUrl:       { type: string }

    # ── TimeSlot ─────────────────────────────────────────────────────────────
    TimeSlot:
      type: object
      required: [id, practitionerId, startTime, endTime, isBooked]
      properties:
        id:             { type: integer }
        practitionerId: { type: integer }
        startTime:      { type: string }
        endTime:        { type: string }
        isBooked:       { type: boolean }
        sessionType:    { type: ["string", "null"] }

    TimeSlotInput:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:   { type: string }
        endTime:     { type: string }
        sessionType: { type: string }

    # ── Booking ──────────────────────────────────────────────────────────────
    Booking:
      type: object
      required: [id, companyId, practitionerId, timeSlotId, status, sessionType, employeeName, employeeEmail, createdAt]
      properties:
        id:             { type: integer }
        companyId:      { type: integer }
        practitionerId: { type: integer }
        timeSlotId:     { type: integer }
        status:         { type: string, enum: [pending, confirmed, completed, cancelled] }
        sessionType:    { type: string }
        employeeName:   { type: string }
        employeeEmail:  { type: string }
        notes:          { type: ["string", "null"] }
        practitionerName: { type: ["string", "null"] }
        companyName:    { type: ["string", "null"] }
        startTime:      { type: ["string", "null"] }
        endTime:        { type: ["string", "null"] }
        createdAt:      { type: string }

    BookingInput:
      type: object
      required: [companyId, practitionerId, timeSlotId, sessionType, employeeName, employeeEmail]
      properties:
        companyId:      { type: integer }
        practitionerId: { type: integer }
        timeSlotId:     { type: integer }
        sessionType:    { type: string }
        employeeName:   { type: string }
        employeeEmail:  { type: string }
        notes:          { type: string }

    BookingUpdate:
      type: object
      properties:
        status: { type: string, enum: [pending, confirmed, completed, cancelled] }
        notes:  { type: string }

    # ── Subscriptions ────────────────────────────────────────────────────────
    SubscriptionPlan:
      type: object
      required: [id, name, priceGbp, billingCycle, description, features, planType]
      properties:
        id:           { type: integer }
        name:         { type: string }
        priceGbp:     { type: number }
        billingCycle: { type: string, enum: [monthly, annual] }
        description:  { type: string }
        features:     { type: array, items: { type: string } }
        planType:     { type: string, enum: [corporate, practitioner] }
        maxBookings:  { type: ["integer", "null"] }

    CompanySubscription:
      type: object
      required: [id, companyId, planId, status, startDate, companyName, planName, priceGbp]
      properties:
        id:          { type: integer }
        companyId:   { type: integer }
        planId:      { type: integer }
        status:      { type: string, enum: [active, cancelled, past_due] }
        startDate:   { type: string }
        endDate:     { type: ["string", "null"] }
        companyName: { type: string }
        planName:    { type: string }
        priceGbp:    { type: number }

    CompanySubscriptionInput:
      type: object
      required: [companyId, planId]
      properties:
        companyId: { type: integer }
        planId:    { type: integer }

    PractitionerSubscription:
      type: object
      required: [id, practitionerId, planId, status, startDate, practitionerName, planName, priceGbp]
      properties:
        id:               { type: integer }
        practitionerId:   { type: integer }
        planId:           { type: integer }
        status:           { type: string, enum: [active, cancelled, past_due] }
        startDate:        { type: string }
        endDate:          { type: ["string", "null"] }
        practitionerName: { type: string }
        planName:         { type: string }
        priceGbp:         { type: number }

    PractitionerSubscriptionInput:
      type: object
      required: [practitionerId, planId]
      properties:
        practitionerId: { type: integer }
        planId:         { type: integer }

    # ── Reviews ──────────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, practitionerId, companyId, rating, comment, reviewerName, createdAt]
      properties:
        id:             { type: integer }
        practitionerId: { type: integer }
        companyId:      { type: integer }
        rating:         { type: integer }
        comment:        { type: string }
        reviewerName:   { type: string }
        createdAt:      { type: string }

    ReviewInput:
      type: object
      required: [practitionerId, companyId, rating, comment, reviewerName]
      properties:
        practitionerId: { type: integer }
        companyId:      { type: integer }
        rating:         { type: integer }
        comment:        { type: string }
        reviewerName:   { type: string }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalPractitioners, totalCompanies, totalBookings, totalRevenue, activePractitioners, activeCompanies, bookingsThisMonth, averageRating]
      properties:
        totalPractitioners:   { type: integer }
        totalCompanies:       { type: integer }
        totalBookings:        { type: integer }
        totalRevenue:         { type: number }
        activePractitioners:  { type: integer }
        activeCompanies:      { type: integer }
        bookingsThisMonth:    { type: integer }
        averageRating:        { type: number }

    SpecialismCount:
      type: object
      required: [specialism, count]
      properties:
        specialism: { type: string }
        count:      { type: integer }

    # ── Location ─────────────────────────────────────────────────────────────
    Location:
      type: object
      required: [id, name, address, city, postcode, capacity, description, type, isActive, amenities, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        address:     { type: string }
        city:        { type: string }
        postcode:    { type: string }
        capacity:    { type: integer }
        description: { type: string }
        type:        { type: string, enum: [office, studio, outdoor, virtual, hotel] }
        imageUrl:    { type: ["string", "null"] }
        amenities:   { type: array, items: { type: string } }
        isActive:    { type: boolean }
        createdAt:   { type: string }

    LocationInput:
      type: object
      required: [name, address, city, postcode, capacity, description, type]
      properties:
        name:        { type: string }
        address:     { type: string }
        city:        { type: string }
        postcode:    { type: string }
        capacity:    { type: integer }
        description: { type: string }
        type:        { type: string, enum: [office, studio, outdoor, virtual, hotel] }
        imageUrl:    { type: string }
        amenities:   { type: array, items: { type: string } }

    LocationUpdate:
      type: object
      properties:
        name:        { type: string }
        address:     { type: string }
        city:        { type: string }
        postcode:    { type: string }
        capacity:    { type: integer }
        description: { type: string }
        type:        { type: string, enum: [office, studio, outdoor, virtual, hotel] }
        imageUrl:    { type: string }
        amenities:   { type: array, items: { type: string } }
        isActive:    { type: boolean }

    Employee:
      type: object
      required: [id, companyId, name, email, sessionAllowancePerMonth, sessionsUsedThisMonth, isActive, createdAt]
      properties:
        id:                       { type: integer }
        companyId:                { type: integer }
        name:                     { type: string }
        email:                    { type: string }
        sessionAllowancePerMonth: { type: integer }
        sessionsUsedThisMonth:    { type: integer }
        isActive:                 { type: boolean }
        createdAt:                { type: string, format: date-time }

    EmployeeCreate:
      type: object
      required: [name, email, companyId]
      properties:
        name:                     { type: string }
        email:                    { type: string }
        companyId:                { type: integer }
        sessionAllowancePerMonth: { type: integer, default: 2 }

    EmployeeLogin:
      type: object
      required: [email, companyId]
      properties:
        email:     { type: string }
        companyId: { type: integer }

    EmployeeBulkItem:
      type: object
      required: [name, email]
      properties:
        name:                     { type: string }
        email:                    { type: string }
        sessionAllowancePerMonth: { type: integer, default: 2 }

    EmployeeBulkCreate:
      type: object
      required: [employees]
      properties:
        employees:
          type: array
          items: { $ref: "#/components/schemas/EmployeeBulkItem" }

    EmployeeBulkInvalid:
      type: object
      required: [row, reason]
      properties:
        row:    { type: integer }
        reason: { type: string }

    EmployeeBulkResult:
      type: object
      required: [created, skipped, invalid, employees]
      properties:
        created:  { type: integer }
        skipped:  { type: integer }
        invalid:
          type: array
          items: { $ref: "#/components/schemas/EmployeeBulkInvalid" }
        employees:
          type: array
          items: { $ref: "#/components/schemas/Employee" }

    CompanyPublic:
      type: object
      required: [id, name, inviteCode]
      properties:
        id:         { type: integer }
        name:       { type: string }
        inviteCode: { type: string }
        logoUrl:    { type: string }

    Utilisation:
      type: object
      required: [totalEmployees, activeThisMonth, sessionsBooked, totalAllowance]
      properties:
        totalEmployees:   { type: integer }
        activeThisMonth:  { type: integer }
        sessionsBooked:   { type: integer }
        totalAllowance:   { type: integer }
        utilisationRate:  { type: number }
